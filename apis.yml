- aid: pred:pred-market-discovery-api
  name: Pred Market Discovery API
  description: >-
    Market information and discovery (public; no auth). Use this section to understand **parent_market_id**
    and **market_id** and to list all markets.


    ## What are parent_market_id and market_id?


    - **parent_market_id:** Identifies a parent market (e.g. a fixture or event). It groups one or more
    child markets. Order and orderbook paths are scoped by parent (e.g. `GET /api/v1/order/{parentMarketID}/orderbook/{marketID}`).
    Cancel and open-orders endpoints are also per parent.

    - **market_id:** Identifies a specific (child) market within a parent (e.g. one outcome: Team A, Team
    B, or Draw). Used in place order body (`market_id`), orderbook path (`marketID`), and cancel body.
    Each parent can have multiple child markets; each child has its own `market_id`.


    You need both when placing orders (parent in the path, market_id in the body) and when fetching orderbooks
    (parent and market in the path).


    ## Getting parent_market_id and market_id


    **Get all markets:** Call `GET /api/v1/market-discovery/discover?verbose=true&limit=50&offset=0`,
    then continue paging with `offset += limit` until all `data.total` rows are consumed. `verbose=true`
    is required for the trading-critical fields that non-verbose responses can omit: `parent_market_data.parent_market_id`,
    `parent_market_data.contract_address`, `parent_market_data.parent_market_type`, `parent_market_data.parent_market_family`,
    and fixture fields such as `fixture.fixture_id` and `fixture.game_start_time`. The response shape
    is `data.parent_markets_list[]`, where each entry has `parent_market_data`, optional `fixture`, optional
    `team_data`, and child `markets[]`.


    **Runtime eligibility used by market-maker style clients:** first filter your own configured markets
    to `active`; then require the discovered parent row to have `parent_market_data.status == "active"`;
    then require the specific child row in `markets[]` to have `status == "active"`. Child statuses such
    as `resolved` or `redeemed` are terminal and should be treated as not quote/trade eligible. For market
    makers, also validate the Polymarket/PRED orderbook or external liquidity source for the child before
    enabling quoting.


    **Important field mapping:** use `parent_market_data.parent_market_id` as the parent path parameter,
    `markets[].market_id` as the child `market_id`, `parent_market_data.contract_address` as the EIP-712
    `verifyingContract`, `parent_market_data.parent_market_family` for family-level config, `parent_market_data.parent_market_type`
    to distinguish fixtures from generic/futures markets, and `fixture.game_start_time` for fixture/live-window
    logic.


    To get details for a single parent (including its child market IDs and statuses), call `GET /api/v1/market-discovery/parents/{parentMarketID}`.


    ## Endpoints


    - `GET /api/v1/market-discovery/discover?verbose=true&limit=50&offset=0` — paginated discovery feed
    for parent markets, child markets, contract addresses, market family/type, and fixture context.

    - `GET /api/v1/market-discovery/parents/{parentMarketID}` — details for one parent, including child
    markets.
