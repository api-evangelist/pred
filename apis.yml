aid: pred
name: Pred
description: >-
  Pred (PRED) is a fully decentralized, peer-to-peer sports prediction exchange
  built on Base, Coinbase's Ethereum Layer 2 network. Rather than a traditional
  sportsbook, Pred runs a real-time central limit order book where traders take
  LONG (YES) and SHORT (NO) positions on sporting outcomes priced between 0.00
  and 1.00 USDC, and prices emerge from live supply and demand. Users keep full
  self-custody of collateral through per-user Gnosis Safe proxy wallets and
  authorize every order with EIP-712 signatures, with on-chain settlement of
  USDC on Base. Winning traders are welcome with no account limits, sub-200ms
  order execution and spreads under 2%. Pred publishes a documented HTTP trading
  API (login-with-signature auth, market discovery, order placement/cancellation,
  portfolio) plus an Ably WebSocket stream for real-time orderbook and order
  events. Initial markets cover the English Premier League and NBA. The company
  has raised $2.5M backed by Accel, Coinbase Ventures and Reverie.
