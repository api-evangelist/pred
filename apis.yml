- aid: pred:pred-overview-api
  name: Pred Overview API
  description: >-
    ## About PRED


    PRED is a fully decentralized prediction market platform built on Base (Ethereum L2), enabling users
    to trade on real-world events with LONG and SHORT positions—similar to perpetual futures trading.


    **LONG positions** profit when the event occurs (YES outcome), while **SHORT positions** profit when
    it doesn't (NO outcome). PRED uses a decentralized architecture where users maintain full custody
    of their funds through Gnosis Safe proxy wallets, requiring cryptographic signatures (EIP-712) for
    every order.


    On first use, the platform automatically creates a Gnosis Safe proxy wallet for each user and requires
    funding it with USDC. All orders are signed by your EOA (Externally Owned Account) to authorize the
    proxy wallet to execute trades.


    ## Getting started


    **Step 1:** Call `POST /api/v1/auth/login-with-signature` with `X-API-Key` header and EIP-712 CreateProxy
    signature. Save from the response:

    - `access_token`

    - `refresh_token`

    - `proxy_wallet_addr`

    - `user_id`

    - `is_enabled_trading`


    **Step 1b (if `is_enabled_trading` is `false` or missing):** Do these in order — (a) `POST /api/v1/user/safe-approval/prepare`
    with `safe_wallet_address = proxy_wallet_addr`; (b) Sign the returned `transactionHash` using raw
    secp256k1 (no EIP-191 prefix); (c) `POST /api/v1/user/safe-approval/execute` with `{ signature, data
    }`; (d) **MANDATORY: Call `POST /api/v1/auth/login-with-signature` again** to get a fresh JWT with
    `is_enabled_trading=true`. Without this re-login, order placement will fail.


    **Before trading:** discover valid parent/child market IDs from `GET /api/v1/market-discovery/discover?verbose=true&limit=50&offset=0`.
    Page with `offset += limit` until `data.total` is exhausted. Use only rows where `parent_market_data.status
    == "active"` and the child `markets[].status == "active"`; treat terminal child statuses such as `resolved`
    or `redeemed` as not quote/trade eligible. `verbose=true` is required for the fields most trading
    clients need: `parent_market_data.parent_market_id`, `parent_market_data.contract_address`, `parent_market_data.parent_market_type`,
    `parent_market_data.parent_market_family`, and fixture metadata. The order contract for signatures
    must come from the discovered parent row.


    **Step 2:** `GET /api/v1/order/{parentMarketID}/orderbook/{marketID}` — prices in cents, sizes in
    shares.


    **Step 3:** `POST /api/v1/order/{parentMarketID}/place` with EIP-712 Order signature. Amount: Long
    = `(price*qty)/100`, Short = `((100-price)*qty)/100`.


    **Step 4:** `GET /api/v1/portfolio/positions`


    **Step 5:** `GET /api/v1/order/{parentMarketID}/open-orders` (recommended, real-time)


    **Step 6:** `DELETE /api/v1/order/{parentMarketID}/cancel`


    For login signature details (CreateProxy domain, message, normalization), see **Authentication**.


    For what `parent_market_id` and `market_id` are and how to obtain them, see **Market Discovery**.


    ## X-API-Key


    The `X-API-Key` header is **required** to use PRED's login-with-signature endpoint (`POST /api/v1/auth/login-with-signature`).
    Please reach out to PRED to request an API key.


    ## Testing APIs from this UI


    **Method 1 — Scalar client (recommended):** Click **Try it** on any endpoint; in the modal that opens,
    click **Open API client**. This opens the Scalar API client in a new context where you can send requests
    without CORS issues.


    **Method 2 — Disable CORS in browser:** Calling the API directly from the "Try it" UI in this documentation
    may fail with **CORS errors** (browsers block cross-origin requests by default). To test from here,
    disable CORS in your browser.


    ### Safari — disable cross-origin restrictions


    Safari is the only major browser with a native menu toggle that does not require restarting or using
    the command line.


    1. **Enable Develop menu:** Go to **Safari > Settings > Advanced** and check **"Show features for
    web developers"**.

    2. **Disable restrictions:** In the **Develop** menu at the top, select **Disable Cross-Origin Restrictions**.

    3. **Refresh** the documentation page for the change to take effect.


    (For other browsers, use their developer-mode or extension options to disable CORS for this origin,
    or call the API from your own app or a tool like curl.)


    ## Environment configuration


    **All of the following are environment-specific.** Choose **Testnet** or **Mainnet** first; then use
    the values from that row for base URL, chain ID, and chain type (login body).


    **IMPORTANT for order signatures:** do **not** hardcode order contract from this table when placing
    orders. For each parent market, use `parent_market_data.contract_address` from market discovery (`GET
    /api/v1/market-discovery/discover?verbose=true&limit=50&offset=0` or `GET /api/v1/market-discovery/parents/{parentMarketID}`)
    as the EIP-712 `verifyingContract`. Different markets can use different order contract addresses.


    | Environment | Base URL (ENV-specific) | Chain ID (ENV-specific) | Chain Type login body (ENV-specific)
    | Login Contract (ENV-specific) | Order Contract (ENV-specific) |

    |-------------|------------------------|-------------------------|--------------------------------------|------------------------------|------------------------------|

    | **Testnet** | `https://testnet.pred.app` | 84532 | `base-sepolia` | `0x306b5C979b812BD6eE6767043A24c5D8870e292A`
    | `0xc76DC1c16E672f04b8faD103269E7474FA620a7B` |

    | **Mainnet** | `https://www.pred.app` | 8453 | `base` | `0xA077e7aaBF2e3c0155F83789e95f46602D03F7f0`
    | `0x1938Af63B717B80ea62ccB4CCBf799F8a28dEFB0` |


    **Chain type in login body:**

    - Testnet: `base-sepolia`

    - Mainnet: `base` (not `base-mainnet`)


    ## How to deposit funds to wallet


    Send **USDC on Base** to your **proxy_wallet_address** (returned in the response from `POST /api/v1/auth/login-with-signature`).
    The proxy wallet is the Gnosis Safe that holds your trading collateral; all orders are executed from
    this wallet.


    **Trial run:** Send 5 USDC (or any minimal amount) as a test. Then place a trade, get it matched,
    and confirm a position is created (e.g. via `GET /api/v1/portfolio/positions`). This end-to-end flow
    verifies funding, login, order placement, and position tracking.
