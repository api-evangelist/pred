apis:
- aid: pred:pred-authentication-api
  name: Pred Authentication API
  description: >-
    Required headers, token refresh, and EIP-712 CreateProxy signature for login. For overview, getting
    started, and environment configuration, see **Overview**.


    ## Required headers


    - `Authorization: Bearer <token>`
      (for authenticated endpoints)
    - `X-API-Key: <api_key>`
      (required for login-with-signature only)
    - `X-Wallet-Address: <wallet_address>`
      (for order and portfolio endpoints)
    - `X-Proxy-Address: <proxy_wallet_address>`
      (for order and portfolio endpoints)

    **Token refresh:** Access tokens are automatically refreshed by the SDK whenever their remaining lifetime
    drops below the configured threshold. The default threshold is **5 minutes**, and can be overridden
    via the `RefreshThresholdSeconds` client option.


    ## EIP-712 login signature — CreateProxy


    Format: `0x<r><s><v>` (132 hex characters). Low-s normalized: `s <= curveOrderHalf`.


    **Domain (NO version field):** All values below are ENV-specific; use the row for your chosen environment
    (see Environment configuration in **Overview**).

    ```

    EIP712Domain type: "EIP712Domain(string name,uint256 chainId,address verifyingContract)"

    name: "Pred Contract Proxy Factory"

    chainId:        <Chain ID from environment table — Testnet 84532, Mainnet 8453>

    verifyingContract: <Login Contract from environment table>

    ```


    **Message:**

    ```

    CreateProxy type: "CreateProxy(address paymentToken,uint256 payment,address paymentReceiver)"

    paymentToken: 0x0000000000000000000000000000000000000000

    payment: 0

    paymentReceiver: 0x0000000000000000000000000000000000000000

    ```


    **Normalization constants:**

    - `curveOrder = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141`

    - `curveOrderHalf = 0x7FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF5D576E7357A4501DDFE92F46681B20A0`
