- code: REFRESH_TOKEN_ALREADY_USED
  status: 401
  meaning: A rotated refresh token was reused; each refresh invalidates the prior refresh token.
  remediation: Use the newest refresh token returned by the last refresh/login; re-login if lost.
- code: TRADING_NOT_ENABLED
  status: 400
  meaning: Order placement/cancellation attempted before Safe approval + mandatory re-login.
  remediation: Run safe-approval prepare/execute then call login-with-signature again for a JWT with is_enabled_trading=true.
