openapi: 3.2.0
info:
  title: PRED Trading Platform Overview API
  version: 1.0.0
  description: '## About PRED


    PRED is a fully decentralized prediction market platform built on Base (Ethereum L2), enabling users to trade on real-world events with LONG and SHORT positions—similar to perpetual futures trading.'
servers:
- url: https://testnet.pred.app
  description: Testnet (ENV-specific). Base Sepolia; chain ID 84532. Use with Testnet row in Environment configuration.
- url: https://www.pred.app
  description: Mainnet (ENV-specific). Base; chain ID 8453. Use with Mainnet row in Environment configuration.
tags:
- name: Overview
  description: '## About PRED


    PRED is a fully decentralized prediction market platform built on Base (Ethereum L2), enabling users to trade on real-world events with LONG and SHORT positions—similar to perpetual futures trading.'
paths:
  /:
    get:
      tags:
      - Overview
      summary: Overview — About PRED, getting started
      description: 'See the **Overview** tag description for: About PRED, getting started, X-API-Key, testing APIs, and environment configuration.'
      operationId: overview
      responses:
        '200':
          description: Documentation only
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from login endpoint
